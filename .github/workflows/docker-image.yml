name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build the Docker image
      run: docker build --file Portfolio_Website/Dockerfile --tag tobylooijkens/portfolio_website:"Portfolio_Website" .
      
    - name: Push the Docker image
      run: docker push tobylooijkens/portfolio_website:"Portfolio_Website"
